name: Feature request
description: Ask for a new capability or a change in behavior
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for something Data Doctor does not do yet (or should do differently).
        Bugs still go through **About → Report issue**.
  - type: input
    id: version
    attributes:
      label: Data Doctor version
      placeholder: "3.2.0 (About window)"
    validations:
      required: true
  - type: textarea
    id: want
    attributes:
      label: What do you want?
      description: The behavior or tool you want, and why it would help.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What happens today
      description: Optional. What you do now instead, or why the current path is not enough.

name: Crash
description: The unexpected-error dialog appeared, or the app quit
title: "[Crash] "
labels: ["crash"]
body:
  - type: markdown
    attributes:
      value: |
        If the in-app crash dialog is still open, **Report on GitHub** signs you in
        (device code) and files the traceback as your GitHub user. This form is for
        filing after the fact from the website.
  - type: input
    id: version
    attributes:
      label: Data Doctor version
      placeholder: "3.0.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What were you doing
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Traceback / app.log tail
      render: shell
